on:
  workflow_dispatch: # launch manually 

jobs:
  DEV:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        run: echo "Deployed to Dev"

  Stage:
    runs-on: ubuntu-latest
    needs: Dev
    steps:
      - name: Deploy
        run: echo "Deployed to Stage"
  PROD:

    runs-on: ubuntu-latest

    needs: STAGE
    steps:
      - name: Deploy
        run: "deploy to Prod"
  